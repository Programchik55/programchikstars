<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programchik Stars</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1d22;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #2b2d35;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .stars-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #f5c542;
            margin: 10px 0;
        }
        .btn {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
        .btn-withdraw {
            background: #31b057;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="stars-icon">⭐</div>
        <h2>Programchik Stars</h2>
        <p>Твой баланс:</p>
        <div class="balance"><span id="stars-count">0</span> Stars</div>
        
        <button class="btn" onclick="watchAd()">🎬 Посмотреть рекламу (+1 Star)</button>
        <button class="btn btn-withdraw" onclick="withdraw()">💸 Вывести Stars</button>
    </div>

    <!-- Динамическая загрузка Adsgram SDK -->
    <script>
        (function() {
            var script = document.createElement('script');
            script.src = 'https://sad.adsgram.ai/js/sad-adsgram.min.js';
            script.async = true;
            document.head.appendChild(script);
        })();
    </script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || "demo_user";

        async function loadBalance() {
            try {
                const res = await fetch(`https://prgrmchikstars-server.onrender.com/api/get-balance/${userId}`);
                const data = await res.json();
                document.getElementById('stars-count').innerText = data.balance;
            } catch(e) {
                console.log("Ошибка загрузки баланса:", e);
            }
        }

        function watchAd() {
            if (!window.Adsgram) {
                tg.showAlert("Рекламная библиотека еще загружается или блокируется сетью. Проверь интернет/VPN.");
                return;
            }

            try {
                const adController = window.Adsgram.init({ blockId: "54505" });
                
                adController.show().then((result) => {
                    setTimeout(loadBalance, 2000);
                    tg.showAlert("Реклама просмотрена! Награда зачисляется ⭐");
                }).catch((error) => {
                    tg.showAlert("Реклама закрыта или недоступна: " + JSON.stringify(error));
                });

            } catch (err) {
                tg.showAlert("Ошибка запуска рекламы: " + err.message);
            }
        }

        function withdraw() {
            const currentBalance = parseInt(document.getElementById('stars-count').innerText);
            if (currentBalance < 15) {
                tg.showAlert("Минимальная сумма вывода — 15 Stars ⭐");
            } else {
                tg.showAlert("Заявка на вывод отправлена!");
            }
        }

        loadBalance();
    </script>
</body>
</html>
