<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programchik Stars</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='12060382' data-sdk='show_12060382'></script>

    <style>
        body {
            background-color: #1c1d22;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #2b2d35;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .stars-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #f5c542;
            margin: 10px 0;
        }
        .btn {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-adsgram {
            background: #2481cc;
        }
        .btn-monetag {
            background: #6c5ce7;
        }
        .btn-withdraw {
            background: #31b057;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="stars-icon">⭐</div>
        <h2>Programchik Stars</h2>
        <p>Твой баланс:</p>
        <div class="balance"><span id="stars-count">...</span> Stars</div>
        
        <!-- Кнопки для двух рекламных сетей -->
        <button class="btn btn-adsgram" onclick="watchAdsgram()">🎬 Смотреть Adsgram (+1 Star)</button>
        <button class="btn btn-monetag" onclick="watchMonetag()">🎬 Смотреть Monetag (+1 Star)</button>
        
        <button class="btn btn-withdraw" onclick="withdraw()">💸 Вывести Stars</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || "demo_user";

        // Инициализация Adsgram Controller (замени ID блока на свой из Adsgram, если он другой)
        const AdController = window.Adsgram?.init({ blockId: "54505" }); 

        // Загрузка баланса с сервера
        async function loadBalance(retries = 3) {
            try {
                const res = await fetch(`https://prgrmchikstars-server.onrender.com/api/get-balance/${userId}`);
                if (!res.ok) throw new Error("Сервер засыпает");
                const data = await res.json();
                document.getElementById('stars-count').innerText = data.balance;
            } catch(e) {
                if (retries > 0) {
                    setTimeout(() => loadBalance(retries - 1), 3000);
                } else {
                    document.getElementById('stars-count').innerText = "0";
                }
            }
        }

        // Отправка запроса на зачисление награды
        function sendReward(attempts = 3) {
            fetch(`https://prgrmchikstars-server.onrender.com/api/adsgram-reward?userid=${userId}`)
                .then(res => {
                    if (!res.ok) throw new Error("Сервер не ответил");
                    return res.text();
                })
                .then(() => {
                    setTimeout(loadBalance, 1000);
                    tg.showAlert("Реклама просмотрена! +1 Star зачислено ⭐");
                })
                .catch(err => {
                    if (attempts > 0) {
                        setTimeout(() => sendReward(attempts - 1), 2000);
                    } else {
                        tg.showAlert("Награда зачислится при следующем обновлении баланса!");
                    }
                });
        }

        // 1. Просмотр Adsgram
        function watchAdsgram() {
            if (AdController) {
                AdController.show().then((result) => {
                    // Успешный просмотр
                    sendReward();
                }).catch((result) => {
                    tg.showAlert("Реклама Adsgram недоступна или была закрыта.");
                });
            } else {
                tg.showAlert("Модуль Adsgram не загрузился.");
            }
        }

        // 2. Просмотр Monetag
        function watchMonetag() {
            if (typeof show_12060382 === 'function') {
                show_12060382().then(() => {
                    sendReward();
                }).catch((error) => {
                    tg.showAlert("Реклама Monetag была закрыта или недоступна.");
                });
            } else {
                tg.showAlert("Модуль Monetag еще загружается...");
            }
        }

        function withdraw() {
            const currentBalance = parseInt(document.getElementById('stars-count').innerText) || 0;
            if (currentBalance < 15) {
                tg.showAlert("Минимальная сумма вывода — 15 Stars ⭐");
            } else {
                tg.showAlert("Заявка на вывод отправлена!");
            }
        }

        // Автозагрузка баланса при запуске
        loadBalance();
    </script>
</body>
</html>
